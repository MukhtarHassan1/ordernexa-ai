name: ordernexa

services:

  # ==========================================================
  # ORDERNEXA PRIMARY DATABASE
  # ==========================================================
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    container_name: ordernexa-postgres
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - ordernexa_postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - ordernexa_network


  # ==========================================================
  # REDIS
  # ==========================================================
  redis:
    image: redis:8.10.1-alpine
    container_name: ordernexa-redis
    restart: unless-stopped

    env_file:
      - .env

    command:
      - /bin/sh
      - -c
      - |
        exec redis-server \
          --appendonly yes \
          --requirepass "$$REDIS_PASSWORD"

    ports:
      - "127.0.0.1:6379:6379"

    volumes:
      - ordernexa_redis_data:/data

    healthcheck:
      test:
        - CMD-SHELL
        - 'redis-cli -a "$$REDIS_PASSWORD" ping 2>/dev/null | grep -q PONG'
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

    networks:
      - ordernexa_network


  # ==========================================================
  # MINIO
  # Private S3-compatible object storage
  # ==========================================================
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: ordernexa-minio
    restart: unless-stopped

    env_file:
      - .env

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

    volumes:
      - ordernexa_minio_data:/data

    networks:
      - ordernexa_network


  # ==========================================================
  # MINIO INITIALIZATION
  # One-time private bucket creation
  # ==========================================================
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: ordernexa-minio-init

    depends_on:
      minio:
        condition: service_started

    env_file:
      - .env

    entrypoint:
      - /bin/sh
      - -c

    command:
      - |
        set -eu

        echo "Waiting for MinIO..."

        attempt=0
        max_attempts=15

        until mc alias set \
          ordernexa \
          http://minio:9000 \
          "$$MINIO_ROOT_USER" \
          "$$MINIO_ROOT_PASSWORD"
        do
          attempt=$$((attempt + 1))

          if [ "$$attempt" -ge "$$max_attempts" ]; then
            echo "ERROR: Cannot connect/authenticate to MinIO after $$max_attempts attempts."
            exit 1
          fi

          echo "MinIO attempt $$attempt/$$max_attempts failed; retrying in 2 seconds..."

          sleep 2
        done

        if [ -z "$${MINIO_BUCKET:-}" ]; then
          echo "ERROR: MINIO_BUCKET is not configured."
          exit 1
        fi

        mc mb --ignore-existing "ordernexa/$$MINIO_BUCKET"

        mc anonymous set none "ordernexa/$$MINIO_BUCKET"

        mc stat "ordernexa/$$MINIO_BUCKET"

        echo "Private bucket '$$MINIO_BUCKET' is ready."

    restart: "no"

    networks:
      - ordernexa_network


  # ==========================================================
  # ODOO DATABASE
  # ==========================================================
  odoo-db:
    image: postgres:15.19-bookworm
    container_name: ordernexa-odoo-db
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${ODOO_DB_USER}
      POSTGRES_PASSWORD: ${ODOO_DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata

    volumes:
      - ordernexa_odoo_db_data:/var/lib/postgresql/data/pgdata

    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d postgres'
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

    networks:
      - ordernexa_network


  # ==========================================================
  # ODOO COMMUNITY ERP
  # External system of record
  # ==========================================================
  odoo:
    image: odoo:19.0-20260908
    container_name: ordernexa-odoo
    restart: unless-stopped

    depends_on:
      odoo-db:
        condition: service_healthy

    env_file:
      - .env

    environment:
      HOST: odoo-db
      PORT: 5432
      USER: ${ODOO_DB_USER}
      PASSWORD: ${ODOO_DB_PASSWORD}

      ORDERNEXA_ODOO_SHARED_SECRET: ${ORDERNEXA_ODOO_SHARED_SECRET}

    ports:
      - "127.0.0.1:8069:8069"

    volumes:
      - ordernexa_odoo_data:/var/lib/odoo
      - ./infra/docker/odoo/addons:/mnt/extra-addons

    networks:
      - ordernexa_network


  # ==========================================================
  # N8N DATABASE
  # ==========================================================
  n8n-db:
    image: postgres:17.11-bookworm
    container_name: ordernexa-n8n-db
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${N8N_DB_NAME}
      POSTGRES_USER: ${N8N_DB_USER}
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD}

    volumes:
      - ordernexa_n8n_db_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

    networks:
      - ordernexa_network


  # ==========================================================
  # N8N COMMUNITY
  # Integration and orchestration only
  # ==========================================================
  n8n:
    image: n8nio/n8n:stable
    container_name: ordernexa-n8n
    restart: unless-stopped

    depends_on:
      n8n-db:
        condition: service_healthy

    env_file:
      - .env

    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME}
      DB_POSTGRESDB_USER: ${N8N_DB_USER}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}

      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: ${N8N_WEBHOOK_URL}

      N8N_SECURE_COOKIE: "false"

      GENERIC_TIMEZONE: UTC
      TZ: UTC

    ports:
      - "127.0.0.1:5678:5678"

    volumes:
      - ordernexa_n8n_data:/home/node/.n8n
      - ./workflows/n8n:/files

    networks:
      - ordernexa_network


    # ==========================================================
  # OLLAMA
  # Local CPU AI runtime
  # ==========================================================
  ollama:
    image: ollama/ollama:0.34.1
    container_name: ordernexa-ollama
    restart: unless-stopped

    environment:
      OLLAMA_HOST: "0.0.0.0:11434"

      # Disable Vulkan GPU detection.
      OLLAMA_VULKAN: "0"

      # Force CPU inference.
      OLLAMA_LLM_LIBRARY: "cpu_avx2"

      # Disable unnecessary cloud requests.
      OLLAMA_NO_CLOUD: "true"

      # Restrict concurrent model execution.
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"

      # Reduced context for initial testing.
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_MAX_QUEUE: "8"
      OLLAMA_LOAD_TIMEOUT: "90s"

      # Enable diagnostic logs.
      OLLAMA_DEBUG: "1"

    volumes:
      - ordernexa_ollama_data:/root/.ollama

    networks:
      - ordernexa_network

  # ==========================================================
  # ORDERNEXA FASTAPI BACKEND
  # Authoritative transaction/business layer
  # ==========================================================
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile

    container_name: ordernexa-api
    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      minio-init:
        condition: service_completed_successfully

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - ./apps/api:/app
      # Local demo/evaluation assets; not production data mounts.
      - ./sample-data:/sample-data:ro
      - ./evals:/evals

    # Optional alternative if Ollama runs directly on the host.
    # Configure OLLAMA_BASE_URL in private .env for the tested Windows-native runtime.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - ordernexa_network


  # ==========================================================
  # OPTIONAL DURABLE AUTOMATION WORKER
  # Start separately when configured: docker compose --profile automation up -d automation-worker
  # Never starts when running the ordinary local API/demo stack.
  # ==========================================================
  automation-worker:
    profiles: ["automation"]
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: ordernexa-automation-worker
    restart: unless-stopped
    command: ["python", "-m", "app.automation.worker"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./apps/api:/app
      - ./sample-data:/sample-data:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ordernexa_network


# ============================================================
# INTERNAL NETWORK
# ============================================================
networks:
  ordernexa_network:
    name: ordernexa-network
    driver: bridge


# ============================================================
# PERSISTENT STORAGE
# ============================================================
volumes:
  ordernexa_postgres_data:
  ordernexa_redis_data:
  ordernexa_minio_data:

  ordernexa_odoo_db_data:
  ordernexa_odoo_data:

  ordernexa_n8n_db_data:
  ordernexa_n8n_data:

  ordernexa_ollama_data: